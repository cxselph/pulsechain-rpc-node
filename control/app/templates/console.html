{% extends "base.html" %}
{% block title %}Console{% endblock %}
{% block content %}
<section class="card console-head" id="console" data-tabs="{{ logs | join(',') }}">
  <p id="console-sync" class="console-sync">Loading sync status…</p>
  <div class="row tight">
    {% for key, (label, _) in logs.items() %}
    <button class="tab" data-tab="{{ key }}">{{ label }}</button>
    {% endfor %}
    <label class="toggle"><input type="checkbox" id="console-filter"> sync lines only</label>
    <button id="console-pause">Pause</button>
    <span class="hint" id="console-state"></span>
  </div>
</section>
<pre class="console" id="console-out" aria-live="off"></pre>
<p class="hint foot">Read-only · last 500 lines · updates every 3 s · <a href="{{ url_for('index') }}">← Back to the dashboard</a></p>
{% endblock %}
