<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}Node control{% endblock %} · {{ hostname }}</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
<link rel="icon" href="{{ url_for('static', filename='favicon-32.png') }}" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PulseNode">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131312" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('index') }}">PulseChain node <span>{{ hostname }}</span></a>
  {% if session.get('auth') %}
  <nav>
    <a href="{{ url_for('console') }}">Console</a>
    <a href="/grafana/" target="grafana" rel="noopener">Grafana</a>
    <form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="link">Sign out</button></form>
  </nav>
  {% endif %}
</header>
<main{% block main_attrs %}{% endblock %}>
{% block content %}{% endblock %}
</main>
</body>
</html>
