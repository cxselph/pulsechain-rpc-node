<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}Node control{% endblock %} · {{ hostname }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('index') }}">PulseChain node <span>{{ hostname }}</span></a>
  {% if session.get('auth') %}
  <nav>
    <a href="{{ url_for('console') }}">Console</a>
    <a href="/grafana/" target="grafana" rel="noopener">Grafana</a>
    <form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="link">Sign out</button></form>
  </nav>
  {% endif %}
</header>
<main{% block main_attrs %}{% endblock %}>
{% block content %}{% endblock %}
</main>
</body>
</html>
