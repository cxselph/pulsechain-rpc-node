# promtool unit tests for monitoring/prometheus/rules.yml (validator readiness)
# and the streak / uptime expressions the dashboard and control page use.
rule_files:
  - /rules/rules.yml
evaluation_interval: 1m

tests:
  # Everything healthy -> ready.
  - interval: 1m
    input_series:
      - {series: 'pulse_el_up{job="node"}', values: '1x20'}
      - {series: 'pulse_cl_up{job="node"}', values: '1x20'}
      - {series: 'pulse_el_syncing{job="node"}', values: '0x20'}
      - {series: 'pulse_cl_sync_distance{job="node"}', values: '1x20'}
      - {series: 'pulse_el_head_age_seconds{job="node"}', values: '8x20'}
      - {series: 'pulse_el_peers{job="node"}', values: '40x20'}
      - {series: 'pulse_cl_peers{job="node"}', values: '45x20'}
      - {series: 'node_timex_sync_status{job="node"}', values: '1x20'}
      - {series: 'node_timex_offset_seconds{job="node"}', values: '0.002x20'}
      - {series: 'p2p_peers_inbound{job="go-pulse"}', values: '6x20'}
    promql_expr_test:
      - {expr: 'pulse:ready', eval_time: 10m, exp_samples: [{labels: 'pulse:ready', value: 1}]}
      - {expr: 'pulse:both_up', eval_time: 10m, exp_samples: [{labels: 'pulse:both_up', value: 1}]}
      - {expr: 'pulse:inbound_peers', eval_time: 10m, exp_samples: [{labels: 'pulse:inbound_peers', value: 6}]}

  # Each failing condition on its own makes ready 0.
  - interval: 1m
    input_series:
      - {series: 'pulse_el_up{job="node"}', values: '1x20'}
      - {series: 'pulse_cl_up{job="node"}', values: '1x20'}
      - {series: 'pulse_el_syncing{job="node"}', values: '1x20'}          # still syncing
      - {series: 'pulse_cl_sync_distance{job="node"}', values: '0x20'}
      - {series: 'pulse_el_peers{job="node"}', values: '40x20'}
      - {series: 'pulse_cl_peers{job="node"}', values: '12x20'}           # too few Prysm peers
      - {series: 'node_timex_sync_status{job="node"}', values: '0x20'}    # clock not synced
      - {series: 'node_timex_offset_seconds{job="node"}', values: '0.002x20'}
    promql_expr_test:
      - {expr: 'pulse:synced', eval_time: 10m, exp_samples: [{labels: 'pulse:synced', value: 0}]}
      - {expr: 'pulse:peers_ok', eval_time: 10m, exp_samples: [{labels: 'pulse:peers_ok', value: 0}]}
      - {expr: 'pulse:clock_ok', eval_time: 10m, exp_samples: [{labels: 'pulse:clock_ok', value: 0}]}
      - {expr: 'pulse:ready', eval_time: 10m, exp_samples: [{labels: 'pulse:ready', value: 0}]}
      - {expr: 'pulse:both_up', eval_time: 10m, exp_samples: [{labels: 'pulse:both_up', value: 1}]}

  # Head stuck while eth_syncing says false (2026-10-24: Prysm at 0 peers, go-pulse
  # not syncing, newest block hours old): not synced.
  - interval: 1m
    input_series:
      - {series: 'pulse_el_up{job="node"}', values: '1x20'}
      - {series: 'pulse_cl_up{job="node"}', values: '1x20'}
      - {series: 'pulse_el_syncing{job="node"}', values: '0x20'}
      - {series: 'pulse_cl_sync_distance{job="node"}', values: '0x20'}
      - {series: 'pulse_el_head_age_seconds{job="node"}', values: '14000+60x20'}
    promql_expr_test:
      - {expr: 'pulse:synced', eval_time: 10m, exp_samples: [{labels: 'pulse:synced', value: 0}]}

  # Head-age alert (Grafana rule pulse-head-stalled; test_monitoring.sh checks the
  # expression below matches rules.yml). Synced for 30 min, then no new blocks:
  # the newest block ages 60 s a minute. Fires once it's over 2 min old.
  - interval: 1m
    input_series:
      - {series: 'pulse_el_up{job="node"}', values: '1x60'}
      - {series: 'pulse_cl_up{job="node"}', values: '1x60'}
      - {series: 'pulse_el_syncing{job="node"}', values: '0x60'}
      - {series: 'pulse_cl_sync_distance{job="node"}', values: '0x60'}
      - {series: 'pulse_el_head_age_seconds{job="node"}', values: '5x29 65+60x30'}
    promql_expr_test:
      - expr: 'count(max(pulse_el_head_age_seconds) > 120 and on() max_over_time(pulse:synced[2d]) == 1)'
        eval_time: 29m
        exp_samples: []
      - expr: 'count(max(pulse_el_head_age_seconds) > 120 and on() max_over_time(pulse:synced[2d]) == 1)'
        eval_time: 32m
        exp_samples: [{labels: '{}', value: 1}]

  # Same alert during an initial sync (never synced yet): stays quiet even though
  # the newest block is days old.
  - interval: 1m
    input_series:
      - {series: 'pulse_el_up{job="node"}', values: '1x60'}
      - {series: 'pulse_cl_up{job="node"}', values: '1x60'}
      - {series: 'pulse_el_syncing{job="node"}', values: '1x60'}
      - {series: 'pulse_cl_sync_distance{job="node"}', values: '0x60'}
      - {series: 'pulse_el_head_age_seconds{job="node"}', values: '900000-100x60'}
    promql_expr_test:
      - expr: 'count(max(pulse_el_head_age_seconds) > 120 and on() max_over_time(pulse:synced[2d]) == 1)'
        eval_time: 50m
        exp_samples: []

  # Clock offset over 0.5 s counts as not ok even when "synchronized".
  - interval: 1m
    input_series:
      - {series: 'node_timex_sync_status{job="node"}', values: '1x5'}
      - {series: 'node_timex_offset_seconds{job="node"}', values: '-0.8x5'}
    promql_expr_test:
      - {expr: 'pulse:clock_ok', eval_time: 3m, exp_samples: [{labels: 'pulse:clock_ok', value: 0}]}

  # No data at all (helper or node_exporter down) -> 0, not "no data".
  - interval: 1m
    input_series:
      - {series: 'unrelated', values: '1x5'}
    promql_expr_test:
      - {expr: 'pulse:both_up', eval_time: 3m, exp_samples: [{labels: 'pulse:both_up', value: 0}]}
      - {expr: 'pulse:ready', eval_time: 3m, exp_samples: [{labels: 'pulse:ready', value: 0}]}

  # Streak and uptime: down for minutes 10-19, healthy otherwise; evaluate at 2h.
  - interval: 1m
    input_series:
      - {series: 'pulse_el_up{job="node"}', values: '1x9 0x9 1x110'}
      - {series: 'pulse_cl_up{job="node"}', values: '1x130'}
      - {series: 'pulse_el_syncing{job="node"}', values: '0x130'}
      - {series: 'pulse_cl_sync_distance{job="node"}', values: '0x130'}
      - {series: 'pulse_el_head_age_seconds{job="node"}', values: '5x130'}
      - {series: 'pulse_el_peers{job="node"}', values: '40x130'}
      - {series: 'pulse_cl_peers{job="node"}', values: '45x130'}
      - {series: 'node_timex_sync_status{job="node"}', values: '1x130'}
      - {series: 'node_timex_offset_seconds{job="node"}', values: '0x130'}
    promql_expr_test:
      # Last not-ready minute was 19m -> streak at 120m is 101 minutes.
      - expr: 'round((time() - max_over_time(pulse:not_ready_at[45d])) / 60)'
        eval_time: 120m
        exp_samples: [{labels: '{}', value: 101}]
      # 10 of 121 evaluated minutes down.
      - expr: 'round((1 - avg_over_time(pulse:both_up[30d])) * count_over_time(pulse:both_up[30d]))'
        eval_time: 120m
        exp_samples: [{labels: '{}', value: 10}]
      - expr: 'ceil(changes(pulse:both_up[30d]) / 2)'
        eval_time: 120m
        exp_samples: [{labels: '{}', value: 1}]

  # Chain disk forecast (Grafana rule pulse-disk-trend; test_monitoring.sh checks
  # the expression below matches rules.yml). 1-minute samples.
  # Like the real install: the initial sync fills over half the disk in a day, then the node
  # is synced with no growth. The old rule fired at 36 h (the window was mostly
  # sync growth). Now: no alert at 36 h, nor once 3 synced days have passed.
  - interval: 1m
    input_series:
      - {series: 'node_filesystem_avail_bytes{instance="n",mountpoint="/blockchain"}', values: '2500000000-1000000x1440 1060000000+0x4380'}
      - {series: 'pulse_el_syncing{instance="n"}', values: '1x1440 0x4380'}
    promql_expr_test:
      - expr: 'count(predict_linear(node_filesystem_avail_bytes{mountpoint="/blockchain"}[3d], 30 * 86400) < 0 and on(instance) node_filesystem_avail_bytes{mountpoint="/blockchain"} offset 62h and on() max(avg_over_time(pulse_el_syncing[3d])) < 0.01 and on() count(pulse_el_syncing offset 62h) > 0)'
        eval_time: 36h
        exp_samples: []
      - expr: 'count(predict_linear(node_filesystem_avail_bytes{mountpoint="/blockchain"}[3d], 30 * 86400) < 0 and on(instance) node_filesystem_avail_bytes{mountpoint="/blockchain"} offset 62h and on() max(avg_over_time(pulse_el_syncing[3d])) < 0.01 and on() count(pulse_el_syncing offset 62h) > 0)'
        eval_time: 97h
        exp_samples: []
  # Synced the whole time but filling fast: alert.
  - interval: 1m
    input_series:
      - {series: 'node_filesystem_avail_bytes{instance="n",mountpoint="/blockchain"}', values: '20000000-2000x5760'}
      - {series: 'pulse_el_syncing{instance="n"}', values: '0x5760'}
    promql_expr_test:
      - expr: 'count(predict_linear(node_filesystem_avail_bytes{mountpoint="/blockchain"}[3d], 30 * 86400) < 0 and on(instance) node_filesystem_avail_bytes{mountpoint="/blockchain"} offset 62h and on() max(avg_over_time(pulse_el_syncing[3d])) < 0.01 and on() count(pulse_el_syncing offset 62h) > 0)'
        eval_time: 4d
        exp_samples: [{labels: '{}', value: 1}]
  # Synced the whole time, slow growth (a minute of catch-up after a reboot): no alert.
  - interval: 1m
    input_series:
      - {series: 'node_filesystem_avail_bytes{instance="n",mountpoint="/blockchain"}', values: '20000000-1x5760'}
      - {series: 'pulse_el_syncing{instance="n"}', values: '0x4000 1x1 0x1758'}
    promql_expr_test:
      - expr: 'count(predict_linear(node_filesystem_avail_bytes{mountpoint="/blockchain"}[3d], 30 * 86400) < 0 and on(instance) node_filesystem_avail_bytes{mountpoint="/blockchain"} offset 62h and on() max(avg_over_time(pulse_el_syncing[3d])) < 0.01 and on() count(pulse_el_syncing offset 62h) > 0)'
        eval_time: 4d
        exp_samples: []
  # Chain disk days left (dashboard tile; test_monitoring.sh checks the expression
  # below matches validator-readiness.json). 10-minute samples.
  # Like the real install: a day of initial sync fills over half the disk, then the
  # node is synced with no growth. The old tile showed ~4 weeks (red) for a week.
  # Now: nothing until 7 synced days, then far over 180 days (green).
  - interval: 10m
    input_series:
      - {series: 'node_filesystem_avail_bytes{instance="n",mountpoint="/blockchain"}', values: '2500000000-10000000x144 1060000000+0x1200'}
      - {series: 'pulse_el_syncing{instance="n"}', values: '1x144 0x1200'}
    promql_expr_test:
      - expr: 'count((node_filesystem_avail_bytes{mountpoint="/blockchain"} / clamp_min(-deriv(node_filesystem_avail_bytes{mountpoint="/blockchain"}[7d]), 1) / 86400 and on(instance) node_filesystem_avail_bytes{mountpoint="/blockchain"} offset 6d and on() max(avg_over_time(pulse_el_syncing[7d])) < 0.01 and on() count(pulse_el_syncing offset 6d) > 0) >= 0)'
        eval_time: 3d
        exp_samples: []
      - expr: 'count((node_filesystem_avail_bytes{mountpoint="/blockchain"} / clamp_min(-deriv(node_filesystem_avail_bytes{mountpoint="/blockchain"}[7d]), 1) / 86400 and on(instance) node_filesystem_avail_bytes{mountpoint="/blockchain"} offset 6d and on() max(avg_over_time(pulse_el_syncing[7d])) < 0.01 and on() count(pulse_el_syncing offset 6d) > 0) >= 0)'
        eval_time: 6d12h
        exp_samples: []
      - expr: 'count((node_filesystem_avail_bytes{mountpoint="/blockchain"} / clamp_min(-deriv(node_filesystem_avail_bytes{mountpoint="/blockchain"}[7d]), 1) / 86400 and on(instance) node_filesystem_avail_bytes{mountpoint="/blockchain"} offset 6d and on() max(avg_over_time(pulse_el_syncing[7d])) < 0.01 and on() count(pulse_el_syncing offset 6d) > 0) > 180)'
        eval_time: 9d
        exp_samples: [{labels: '{}', value: 1}]
  # Synced the whole time but filling fast (~6 days left): shown, under 90 (red).
  - interval: 10m
    input_series:
      - {series: 'node_filesystem_avail_bytes{instance="n",mountpoint="/blockchain"}', values: '2000000000-1000000x1200'}
      - {series: 'pulse_el_syncing{instance="n"}', values: '0x1200'}
    promql_expr_test:
      - expr: 'count((node_filesystem_avail_bytes{mountpoint="/blockchain"} / clamp_min(-deriv(node_filesystem_avail_bytes{mountpoint="/blockchain"}[7d]), 1) / 86400 and on(instance) node_filesystem_avail_bytes{mountpoint="/blockchain"} offset 6d and on() max(avg_over_time(pulse_el_syncing[7d])) < 0.01 and on() count(pulse_el_syncing offset 6d) > 0) < 90)'
        eval_time: 8d
        exp_samples: [{labels: '{}', value: 1}]
  # Synced, slow growth with a 10-minute catch-up after a reboot: still shown, green.
  - interval: 10m
    input_series:
      - {series: 'node_filesystem_avail_bytes{instance="n",mountpoint="/blockchain"}', values: '2000000000-1000x1200'}
      - {series: 'pulse_el_syncing{instance="n"}', values: '0x1000 1x1 0x199'}
    promql_expr_test:
      - expr: 'count((node_filesystem_avail_bytes{mountpoint="/blockchain"} / clamp_min(-deriv(node_filesystem_avail_bytes{mountpoint="/blockchain"}[7d]), 1) / 86400 and on(instance) node_filesystem_avail_bytes{mountpoint="/blockchain"} offset 6d and on() max(avg_over_time(pulse_el_syncing[7d])) < 0.01 and on() count(pulse_el_syncing offset 6d) > 0) > 180)'
        eval_time: 8d
        exp_samples: [{labels: '{}', value: 1}]
