# promtool unit tests for the validator alert expressions (Grafana rules
# pulse-val-* in monitoring/grafana/provisioning/alerting/rules.yml).
# tests/test_monitoring.sh checks each expression here matches rules.yml.
# The Grafana rules wrap each in count(...) and fire when it is above 0.
rule_files: []
evaluation_interval: 1m

tests:
  # Switched off: a down validator client raises nothing.
  - interval: 1m
    input_series:
      - {series: 'up{job="validator", instance="127.0.0.1:8081", pubkey="0xaa"}', values: '0x40'}
      - {series: 'pulse_validator_enabled{job="node", instance="127.0.0.1:9100"}', values: '0x40'}
    promql_expr_test:
      - {expr: 'count((up{job="validator"} == 0 or absent(up{job="validator"})) and on() max(pulse_validator_enabled) == 1)', eval_time: 30m, exp_samples: []}

  # Switched on: down for 5 min -> alert; running -> none.
  - interval: 1m
    input_series:
      - {series: 'up{job="validator", instance="127.0.0.1:8081", pubkey="0xaa"}', values: '0x40'}
      - {series: 'pulse_validator_enabled{job="node", instance="127.0.0.1:9100"}', values: '1x40'}
      - {series: 'up{job="validator", instance="other"}', values: '1x40'}
    promql_expr_test:
      - {expr: 'count((up{job="validator"} == 0 or absent(up{job="validator"})) and on() max(pulse_validator_enabled) == 1)', eval_time: 30m, exp_samples: [{labels: '{}', value: 1}]}

  # Switched on and up: nothing.
  - interval: 1m
    input_series:
      - {series: 'up{job="validator", instance="127.0.0.1:8081", pubkey="0xaa"}', values: '1x40'}
      - {series: 'pulse_validator_enabled{job="node", instance="127.0.0.1:9100"}', values: '1x40'}
    promql_expr_test:
      - {expr: 'count((up{job="validator"} == 0 or absent(up{job="validator"})) and on() max(pulse_validator_enabled) == 1)', eval_time: 30m, exp_samples: []}

  # Active, last attestation 140 slots behind the head -> missed.
  - interval: 1m
    input_series:
      - {series: 'pulse_validator_enabled{job="node", instance="127.0.0.1:9100"}', values: '1x60'}
      - {series: 'pulse_cl_head_slot{job="node", instance="127.0.0.1:9100"}', values: '1000x60'}
      - {series: 'validator_statuses{job="validator", instance="127.0.0.1:8081", pubkey="0xaa"}', values: '3x60'}
      - {series: 'validator_last_attested_slot{job="validator", instance="127.0.0.1:8081", pubkey="0xaa"}', values: '860x60'}
      - {series: 'process_start_time_seconds{job="validator", instance="127.0.0.1:8081", pubkey="0xaa"}', values: '0x60'}
    promql_expr_test:
      - {expr: 'count(((scalar(max(pulse_cl_head_slot)) - validator_last_attested_slot > 128) or (validator_statuses == 3 unless on(pubkey) validator_last_attested_slot and on() time() - max(process_start_time_seconds{job="validator"}) > 1800)) and on(pubkey) validator_statuses == 3 and on() max(pulse_validator_enabled) == 1)', eval_time: 40m, exp_samples: [{labels: '{}', value: 1}]}

  # Active, attested 40 slots ago -> fine.
  - interval: 1m
    input_series:
      - {series: 'pulse_validator_enabled{job="node", instance="127.0.0.1:9100"}', values: '1x60'}
      - {series: 'pulse_cl_head_slot{job="node", instance="127.0.0.1:9100"}', values: '1000x60'}
      - {series: 'validator_statuses{job="validator", instance="127.0.0.1:8081", pubkey="0xaa"}', values: '3x60'}
      - {series: 'validator_last_attested_slot{job="validator", instance="127.0.0.1:8081", pubkey="0xaa"}', values: '960x60'}
      - {series: 'process_start_time_seconds{job="validator", instance="127.0.0.1:8081", pubkey="0xaa"}', values: '0x60'}
    promql_expr_test:
      - {expr: 'count(((scalar(max(pulse_cl_head_slot)) - validator_last_attested_slot > 128) or (validator_statuses == 3 unless on(pubkey) validator_last_attested_slot and on() time() - max(process_start_time_seconds{job="validator"}) > 1800)) and on(pubkey) validator_statuses == 3 and on() max(pulse_validator_enabled) == 1)', eval_time: 40m, exp_samples: []}

  # Active, client started 40 min ago and never attested -> missed; at 10 min (doppelganger) -> not yet.
  - interval: 1m
    input_series:
      - {series: 'pulse_validator_enabled{job="node", instance="127.0.0.1:9100"}', values: '1x60'}
      - {series: 'pulse_cl_head_slot{job="node", instance="127.0.0.1:9100"}', values: '1000x60'}
      - {series: 'validator_statuses{job="validator", instance="127.0.0.1:8081", pubkey="0xaa"}', values: '3x60'}
      - {series: 'process_start_time_seconds{job="validator", instance="127.0.0.1:8081", pubkey="0xaa"}', values: '0x60'}
    promql_expr_test:
      - {expr: 'count(((scalar(max(pulse_cl_head_slot)) - validator_last_attested_slot > 128) or (validator_statuses == 3 unless on(pubkey) validator_last_attested_slot and on() time() - max(process_start_time_seconds{job="validator"}) > 1800)) and on(pubkey) validator_statuses == 3 and on() max(pulse_validator_enabled) == 1)', eval_time: 40m, exp_samples: [{labels: '{}', value: 1}]}
      - {expr: 'count(((scalar(max(pulse_cl_head_slot)) - validator_last_attested_slot > 128) or (validator_statuses == 3 unless on(pubkey) validator_last_attested_slot and on() time() - max(process_start_time_seconds{job="validator"}) > 1800)) and on(pubkey) validator_statuses == 3 and on() max(pulse_validator_enabled) == 1)', eval_time: 10m, exp_samples: []}

  # Pending (waiting for activation), never attested -> nothing. Switched off -> nothing.
  - interval: 1m
    input_series:
      - {series: 'pulse_validator_enabled{job="node", instance="127.0.0.1:9100"}', values: '1x60'}
      - {series: 'pulse_cl_head_slot{job="node", instance="127.0.0.1:9100"}', values: '1000x60'}
      - {series: 'validator_statuses{job="validator", instance="127.0.0.1:8081", pubkey="0xaa"}', values: '2x60'}
      - {series: 'process_start_time_seconds{job="validator", instance="127.0.0.1:8081", pubkey="0xaa"}', values: '0x60'}
      - {series: 'validator_statuses{job="validator", instance="127.0.0.1:8081", pubkey="0xbb"}', values: '3x60'}
      - {series: 'validator_last_attested_slot{job="validator", instance="127.0.0.1:8081", pubkey="0xbb"}', values: '100x60'}
    promql_expr_test:
      - {expr: 'count(((scalar(max(pulse_cl_head_slot)) - validator_last_attested_slot > 128) or (validator_statuses == 3 unless on(pubkey) validator_last_attested_slot and on() time() - max(process_start_time_seconds{job="validator"}) > 1800)) and on(pubkey) validator_statuses == 3 and on() max(pulse_validator_enabled) == 1)', eval_time: 40m, exp_samples: [{labels: '{}', value: 1}]}

  # Switched off: a stale attestation raises nothing.
  - interval: 1m
    input_series:
      - {series: 'pulse_validator_enabled{job="node", instance="127.0.0.1:9100"}', values: '0x60'}
      - {series: 'pulse_cl_head_slot{job="node", instance="127.0.0.1:9100"}', values: '1000x60'}
      - {series: 'validator_statuses{job="validator", instance="127.0.0.1:8081", pubkey="0xaa"}', values: '3x60'}
      - {series: 'validator_last_attested_slot{job="validator", instance="127.0.0.1:8081", pubkey="0xaa"}', values: '100x60'}
      - {series: 'process_start_time_seconds{job="validator", instance="127.0.0.1:8081", pubkey="0xaa"}', values: '0x60'}
    promql_expr_test:
      - {expr: 'count(((scalar(max(pulse_cl_head_slot)) - validator_last_attested_slot > 128) or (validator_statuses == 3 unless on(pubkey) validator_last_attested_slot and on() time() - max(process_start_time_seconds{job="validator"}) > 1800)) and on(pubkey) validator_statuses == 3 and on() max(pulse_validator_enabled) == 1)', eval_time: 40m, exp_samples: []}

  # Target wrong for 30+ min -> alert; with one correct vote -> none; too little data -> none.
  - interval: 1m
    input_series:
      - {series: 'pulse_validator_enabled{job="node", instance="127.0.0.1:9100"}', values: '1x60'}
      - {series: 'validator_statuses{job="validator", instance="127.0.0.1:8081", pubkey="0xaa"}', values: '3x60'}
      - {series: 'validator_correctly_voted_target{job="validator", instance="127.0.0.1:8081", pubkey="0xaa"}', values: '0x60'}
      - {series: 'validator_statuses{job="validator", instance="i", pubkey="0xbb"}', values: '3x60'}
      - {series: 'validator_correctly_voted_target{job="validator", instance="i", pubkey="0xbb"}', values: '0x40 1 0x19'}
      - {series: 'validator_statuses{job="validator", instance="i", pubkey="0xcc"}', values: '3x60'}
      - {series: 'validator_correctly_voted_target{job="validator", instance="i", pubkey="0xcc"}', values: '_x49 0x10'}
    promql_expr_test:
      - {expr: 'count(max_over_time(validator_correctly_voted_target[30m]) == 0 and on(pubkey) validator_correctly_voted_target offset 29m and on(pubkey) validator_statuses == 3 and on() max(pulse_validator_enabled) == 1)', eval_time: 59m, exp_samples: [{labels: '{}', value: 1}]}

  # Balance below 32M and lower than an hour ago -> alert. Above 32M (a withdrawal) or recovering -> none.
  - interval: 1m
    input_series:
      - {series: 'pulse_validator_enabled{job="node", instance="127.0.0.1:9100"}', values: '1x120'}
      - {series: 'validator_statuses{job="validator", instance="127.0.0.1:8081", pubkey="0xaa"}', values: '3x120'}
      - {series: 'validator_balance{job="validator", instance="127.0.0.1:8081", pubkey="0xaa"}', values: '32000010-0.2x120'}
      - {series: 'validator_statuses{job="validator", instance="i", pubkey="0xbb"}', values: '3x120'}
      - {series: 'validator_balance{job="validator", instance="i", pubkey="0xbb"}', values: '32000900x60 32000100x60'}
      - {series: 'validator_statuses{job="validator", instance="i", pubkey="0xcc"}', values: '3x120'}
      - {series: 'validator_balance{job="validator", instance="i", pubkey="0xcc"}', values: '31999000+1x120'}
    promql_expr_test:
      - {expr: 'count(validator_balance < 32000000 and validator_balance < validator_balance offset 1h and on(pubkey) validator_statuses == 3 and on() max(pulse_validator_enabled) == 1)', eval_time: 110m, exp_samples: [{labels: '{}', value: 1}]}

  # Slashed or exiting -> alert; active -> none.
  - interval: 1m
    input_series:
      - {series: 'pulse_validator_enabled{job="node", instance="127.0.0.1:9100"}', values: '1x10'}
      - {series: 'validator_statuses{job="validator", instance="127.0.0.1:8081", pubkey="0xaa"}', values: '5x10'}
      - {series: 'validator_statuses{job="validator", instance="i", pubkey="0xbb"}', values: '3x10'}
    promql_expr_test:
      - {expr: 'count(validator_statuses >= 4 and validator_statuses <= 6 and on() max(pulse_validator_enabled) == 1)', eval_time: 5m, exp_samples: [{labels: '{}', value: 1}]}

  # Slashing protection rejected an attestation -> alert; nothing rejected -> none.
  - interval: 1m
    input_series:
      - {series: 'pulse_validator_enabled{job="node", instance="127.0.0.1:9100"}', values: '1x10'}
      - {series: 'validator_attestations_rejected_total{job="validator", instance="127.0.0.1:8081", pubkey="0xaa"}', values: '1x10'}
      - {series: 'validator_proposals_rejected_total{job="validator", instance="127.0.0.1:8081", pubkey="0xaa"}', values: '0x10'}
    promql_expr_test:
      - {expr: 'count((validator_attestations_rejected_total > 0 or validator_proposals_rejected_total > 0) and on() max(pulse_validator_enabled) == 1)', eval_time: 5m, exp_samples: [{labels: '{}', value: 1}]}

  # No rejections -> none.
  - interval: 1m
    input_series:
      - {series: 'pulse_validator_enabled{job="node", instance="127.0.0.1:9100"}', values: '1x10'}
      - {series: 'validator_proposals_rejected_total{job="validator", instance="127.0.0.1:8081", pubkey="0xaa"}', values: '0x10'}
    promql_expr_test:
      - {expr: 'count((validator_attestations_rejected_total > 0 or validator_proposals_rejected_total > 0) and on() max(pulse_validator_enabled) == 1)', eval_time: 5m, exp_samples: []}
