# Dependabot proposes dependency updates as PRs; nothing merges or installs
# on its own. The cooldown holds a new release back until it has been public
# for a while, so a hijacked or broken publish is usually caught and pulled
# upstream before we ever see a PR for it. Security fixes for known
# vulnerabilities skip both the cooldown and the major-version filter below.
#
# Covered here: GitHub Actions, and the Docker Hub images in
# monitoring/docker-compose.yml and proxy/docker-compose.yml. The node images (go-pulse,
# prysm-pulse) live on registry.gitlab.com and are tracked by
# .github/workflows/upstream-releases.yml instead.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker-compose"
    directory: "/monitoring"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker-compose"
    directory: "/proxy"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
