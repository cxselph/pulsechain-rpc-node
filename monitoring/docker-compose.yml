# pulsechain-rpc-node — optional monitoring stack (Prometheus + node_exporter + Grafana)
# Separate Compose project, so the node's own scripts never touch it.
# Start with ./monitoring/install.sh (first time) or ./monitoring/start.sh.
#
# Everything binds 127.0.0.1 only (host networking, like the node):
#   Grafana        127.0.0.1:3000/grafana/
#   Prometheus     127.0.0.1:9090
#   node_exporter  127.0.0.1:9100
# Nothing here needs a firewall rule. Reach Grafana through an SSH tunnel, or
# through the HTTPS front end once it is set up.
#
# Images are pinned by tag + digest. Change them only through a reviewed PR.

name: pulse-monitoring

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    container_name: pulse-prometheus
    network_mode: host
    restart: unless-stopped
    user: "65534:65534"
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${DATA_DIR:-/blockchain}/monitoring/prometheus:/prometheus

  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: pulse-node-exporter
    network_mode: host
    pid: host
    restart: unless-stopped
    logging: *default-logging
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
      # Node status written every 30 s by the pulse-node-metrics timer (see exporter/).
      - --collector.textfile.directory=/textfile
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
    volumes:
      - /:/host:ro,rslave
      - /var/lib/pulse-node-metrics:/textfile:ro

  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    container_name: pulse-grafana
    network_mode: host
    restart: unless-stopped
    logging: *default-logging
    # SMTP settings and the alert recipient (secrets) — see .env.example.
    env_file: .env
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      # Served under /grafana/ so the HTTPS front end can route https://<host>/grafana/.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # true once Grafana is only reached over HTTPS (set in .env).
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
      # Only used when the Grafana database is first created (install.sh passes a
      # random one, then sets your real password). Ignored afterwards.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_INITIAL_ADMIN_PASSWORD:-}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # No phoning home, no plugin downloads at startup.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana-dashboards:ro
      - ${DATA_DIR:-/blockchain}/monitoring/grafana:/var/lib/grafana
