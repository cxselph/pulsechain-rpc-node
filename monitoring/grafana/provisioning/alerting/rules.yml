# Alert rules (Grafana-managed). Each query counts what is wrong; the rule
# fires when the count is above 0. No result means nothing is wrong (OK).
# Rules that look back over a window also require most of that window to have
# data (count_over_time), so a fresh install can't trip them on day one.
apiVersion: 1
groups:
  - orgId: 1
    name: pulsechain-node
    folder: PulseChain
    interval: 1m
    rules:
      - uid: pulse-el-down
        title: 'go-pulse is not answering'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'count(pulse_el_up == 0)'
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: 'go-pulse JSON-RPC on this host has not answered for 5 minutes. Wallets can''t use the node.'
          description: 'On the VM: ./status.sh and ./logs.sh geth. The container may be stopped or crash-looping.'
      - uid: pulse-cl-down
        title: 'Prysm beacon node is not answering'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'count(pulse_cl_up == 0)'
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: 'The Prysm beacon API has not answered for 5 minutes. Without it go-pulse can''t follow the chain.'
          description: 'On the VM: ./status.sh and ./logs.sh beacon.'
      - uid: pulse-target-down
        title: 'A monitoring target is down'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'count(up{job=~"go-pulse|prysm|node|prometheus"} == 0)'
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: 'Prometheus can''t scrape go-pulse, Prysm, node_exporter or itself.'
          description: 'Check the containers: ./status.sh and ./monitoring/status.sh.'
      - uid: pulse-helper-stale
        title: 'Node status helper stopped'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'count(time() - pulse_metrics_last_run_timestamp_seconds > 300)'
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 2m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: 'The pulse-node-metrics timer hasn''t written node status for over 5 minutes, so sync and peer alerts are blind.'
          description: 'On the VM: systemctl status pulse-node-metrics.timer pulse-node-metrics.service'
      - uid: pulse-sync-stalled
        title: 'Initial sync stalled'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'count(pulse_el_syncing == 1 and delta(pulse_el_sync_progress[1h]) <= 0 and count_over_time(pulse_el_sync_progress[1h]) > 200)'
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: 'go-pulse is syncing but none of its block or snap-sync counters moved in the last hour.'
          description: 'Check peers and logs: ./status.sh, ./logs.sh geth. A restart (./restart.sh) often clears a stuck sync.'
      - uid: pulse-head-stalled
        title: 'Chain head stopped advancing'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'count(max(pulse_el_head_age_seconds) > 120 and on() max_over_time(pulse:synced[2d]) == 1)'
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 3m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: 'The newest block go-pulse has is over 2 minutes old (PulseChain makes one every 10 seconds), so the node has stopped following the chain. eth_syncing may still say false.'
          description: 'Check ./status.sh: Prysm peers (0 peers means it cannot hear the network; the watchdog restarts it after 10 min), el_offline, and ./logs.sh beacon. Only after the node has been synced at some point in the last 2 days, so an initial sync does not trip it.'
      - uid: pulse-behind
        title: 'Beacon node falling behind'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'count(pulse_cl_sync_distance > 50)'
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: 'The beacon node has been more than 50 slots behind the network head for 15 minutes.'
          description: 'Check peers and the host''s CPU / disk load in Grafana.'
      - uid: pulse-peers-low
        title: 'Low peer count'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'count(pulse_el_peers < 5 or pulse_cl_peers < 5)'
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: 'go-pulse or Prysm has had fewer than 5 peers for 15 minutes.'
          description: 'Check the router port forwards (30303 TCP/UDP, 13000 TCP, 12000 UDP) and the VM firewall (sudo ufw status).'
      - uid: pulse-el-offline
        title: 'Beacon node can''t reach go-pulse'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'count(pulse_cl_el_offline == 1 and pulse_el_syncing == 0)'
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: 'Prysm reports the execution client offline although go-pulse says it is synced.'
          description: 'Check the Engine API link: both containers running, /blockchain/jwt.hex unchanged, ./logs.sh beacon.'
      - uid: pulse-disk-high
        title: 'Disk over 85% full'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'count(100 * (1 - node_filesystem_avail_bytes{mountpoint=~"/|/blockchain"} / node_filesystem_size_bytes{mountpoint=~"/|/blockchain"}) > 85)'
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: 'The chain disk (/blockchain) or the VM''s system disk (/) is over 85% full.'
          description: 'Chain disk: grow it in Proxmox (qm resize 101 scsi1 +500G, then resize2fs). System disk: docker system df, old images and logs.'
      - uid: pulse-disk-trend
        title: 'Chain disk full within 30 days'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              # The 3-day window must be (nearly) all synced: right after the initial
              # sync it still holds the sync's fast growth and would cry wolf.
              # The offset 62h terms require data from about 2.6 days ago.
              expr: 'count(predict_linear(node_filesystem_avail_bytes{mountpoint="/blockchain"}[3d], 30 * 86400) < 0 and on(instance) node_filesystem_avail_bytes{mountpoint="/blockchain"} offset 62h and on() max(avg_over_time(pulse_el_syncing[3d])) < 0.01 and on() count(pulse_el_syncing offset 62h) > 0)'
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 1h
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: 'At the last 3 days'' growth rate, /blockchain will be full within 30 days. (Only checked once the node has been synced for the whole 3 days, so the initial sync''s fast growth doesn''t count.)'
          description: 'Plan to grow the chain disk in Proxmox, or check what is growing.'
      - uid: pulse-restart-loop
        title: 'Node client restarting repeatedly'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'count(changes(up{job=~"go-pulse|prysm"}[1h]) >= 6)'
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: 'go-pulse or Prysm went down and came back at least 3 times in the last hour.'
          description: 'Check ./logs.sh for crash messages, and the VM''s memory in Grafana.'
      - uid: pulse-clock
        title: 'Clock out of sync'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'count(node_timex_sync_status == 0 or abs(node_timex_offset_seconds) > 0.5)'
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: 'The node''s clock has been unsynchronized, or more than 0.5 s off, for 15 minutes. Validator duties run in 10-second slots, and JWT auth between the clients also needs an accurate clock.'
          description: 'On the VM: timedatectl (System clock synchronized: yes). Check that systemd-timesyncd is running and NTP isn''t blocked.'
      - uid: pulse-no-inbound
        title: 'No inbound peers'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'count(max(p2p_peers_inbound{job="go-pulse"}) == 0 and on() max(pulse_el_syncing) == 0)'
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 6h
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: 'go-pulse has had no inbound peers for 6 hours since the initial sync finished, so other nodes can''t reach it. The router port forwards or the VM firewall have probably changed.'
          description: 'Check the router forwards (30303 TCP/UDP, 13000 TCP, 12000 UDP to the node) and sudo ufw status on the VM.'
      # Resync after a reboot. The status helper times boot -> back in sync.
      # The report isn't a problem: it fires once per reboot, goes to the
      # email-report contact point (no "resolved" email) and the series
      # disappears 30 min later. Its labels carry the times for the email.
      - uid: pulse-resync-report
        title: 'Back in sync after a reboot'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'max by (booted, up, synced, took, verdict, down, outage) (pulse_resync_report)'
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0m
        noDataState: OK
        execErrState: Error
        labels: { severity: info, notify: report }
        annotations:
          summary: 'The node was back in sync {{ .Labels.took }} after the VM booted ({{ .Labels.verdict }}). Booted {{ .Labels.booted }}, both clients answering {{ .Labels.up }}, synced {{ .Labels.synced }}.'
          description: 'Whole outage, including shutdown and any host restart: {{ .Labels.outage }} (both clients last answered before the reboot at {{ .Labels.down }}). Times are when the 30-second status helper saw each step.'
      # Keep 900 in step with RESYNC_TARGET in exporter/pulse-node-metrics.py.
      - uid: pulse-resync-slow
        title: 'Not back in sync 15 min after a reboot'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'count(pulse_resync_pending == 1 and pulse_resync_elapsed_seconds > 900)'
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: 'The VM booted over 15 minutes ago and the node is still not back in sync. The report email follows once it is.'
          description: 'Check ./status.sh (peers, sync distance) and ./logs.sh. The Validator readiness dashboard shows the resync time once it finishes.'
  # Validator (validator/). Every rule is gated on pulse_validator_enabled, which the
  # status helper sets from the ENABLED marker, so nothing fires while it's switched off.
  # The expressions are unit-tested in tests/promtool/validator_alerts_test.yml.
  - orgId: 1
    name: pulsechain-validator
    folder: PulseChain
    interval: 1m
    rules:
      - uid: pulse-val-down
        title: 'Validator client is down'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'count((up{job="validator"} == 0 or absent(up{job="validator"})) and on() max(pulse_validator_enabled) == 1)'
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: 'The validator is switched on, but Prometheus hasn''t reached its client for 5 minutes. While it''s down it misses every attestation and loses a little balance.'
          description: 'On the VM: ./validator/status.sh and ./validator/logs.sh. If it was stopped on purpose, start it with sudo ./validator/start.sh (or switch it off with sudo ./validator/disable.sh).'
      - uid: pulse-val-missed
        title: 'Validator is missing attestations'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'count(((scalar(max(pulse_cl_head_slot)) - validator_last_attested_slot > 128) or (validator_statuses == 3 unless on(pubkey) validator_last_attested_slot and on() time() - max(process_start_time_seconds{job="validator"}) > 1800)) and on(pubkey) validator_statuses == 3 and on() max(pulse_validator_enabled) == 1)'
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: 'An active validator hasn''t attested for over 4 epochs (about 21 minutes), or not at all in the 30 minutes since its client started. Doppelganger protection only explains the first 2-3 epochs after a start.'
          description: 'On the VM: ./validator/logs.sh (look for errors submitting attestations), ./status.sh (is the beacon synced, with peers?). Check the clock: timedatectl.'
      - uid: pulse-val-wrong-target
        title: 'Validator votes keep missing the target'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'count(max_over_time(validator_correctly_voted_target[30m]) == 0 and on(pubkey) validator_correctly_voted_target offset 29m and on(pubkey) validator_statuses == 3 and on() max(pulse_validator_enabled) == 1)'
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: 'For 30 minutes (about 6 epochs) none of this validator''s attestations voted the correct target, so they earn little or nothing. Usually the beacon node is behind or has too few peers.'
          description: 'Check the Node overview dashboard (beacon slots behind, Prysm peers) and ./validator/logs.sh (Previous epoch voting summary).'
      - uid: pulse-val-balance
        title: 'Validator balance falling below 32M'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'count(validator_balance < 32000000 and validator_balance < validator_balance offset 1h and on(pubkey) validator_statuses == 3 and on() max(pulse_validator_enabled) == 1)'
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: 'An active validator''s balance is below 32,000,000 PLS and lower than an hour ago, so it is losing principal (offline, or voting badly).'
          description: 'See the Validator dashboard (attestations, votes) and ./validator/logs.sh. Withdrawals never take the balance below 32M, so this is penalties.'
      - uid: pulse-val-exiting
        title: 'Validator is slashed, exiting or exited'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'count(validator_statuses >= 4 and validator_statuses <= 6 and on() max(pulse_validator_enabled) == 1)'
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: 'The beacon chain reports a validator as exiting, slashed or exited. If you didn''t start a voluntary exit, treat this as a slashing.'
          description: 'Status codes: 4 exiting, 5 slashing, 6 exited. Stop it (sudo ./validator/stop.sh), check where else the keys could be running, and look the validator up on the beacon explorer.'
      - uid: pulse-val-protection
        title: 'Slashing protection refused to sign'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'count((validator_attestations_rejected_total > 0 or validator_proposals_rejected_total > 0) and on() max(pulse_validator_enabled) == 1)'
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        for: 0m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: 'The validator''s slashing-protection DB refused to sign something it would have been slashed for. That means another copy of these keys is running, or this DB was restored from an older copy. The alert stays until the client restarts.'
          description: 'Stop every other machine that might hold these keys first. Then: ./validator/logs.sh. Don''t restart this one until you know why.'
