# pulsechain-rpc-node — optional HTTPS front end (Caddy)
# One hostname for wallets (https://<host>, wss://<host>), Grafana (/grafana/)
# and a landing page. Separate Compose project; set up with ./proxy/install.sh.
#
# Listens on 443 (and 80, which only redirects to 443) on all interfaces, so
# UFW limits both to LAN_ALLOW_FROM. Never port-forward them on the router.
# The certificate comes from your own CA and lives in /etc/pulse-proxy/tls.

name: pulse-proxy

services:
  caddy:
    image: caddy:2.11.7@sha256:5e5286cb37d44086d651a5363f05f43a692ce4d649d88fb1bd844579f45fa9e8
    container_name: pulse-caddy
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME in proxy/.env}
      HTTP_PORT: ${HTTP_PORT:-8545}
      WS_PORT: ${WS_PORT:-8546}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - /etc/pulse-proxy/tls:/etc/caddy/tls:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp

volumes:
  caddy-data:
  caddy-config:
